[project]
name = "munshi-mcp"
version = "0.1.0"
description = "Munshi's MCP server: exposes a shop's khata and inventory to any MCP host."
requires-python = ">=3.12"
dependencies = ["fastmcp>=4.1", "pydantic-settings>=2.16"]

[project.scripts]
munshi-mcp = "munshi_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
