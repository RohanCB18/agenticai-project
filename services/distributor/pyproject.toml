[project]
name = "munshi-distributor"
version = "0.1.0"
description = "A wholesaler's agent that Munshi negotiates reorders with over A2A."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "pydantic-settings>=2.16",
    "a2a-sdk[fastapi]==1.3.0",
    "langgraph==1.2.19",
    "pyjwt==2.10.1",
]

[project.scripts]
munshi-distributor = "munshi_distributor.app:main"

# Vercel's Python runtime serves this FastAPI app (the A2A agent card and JSON-RPC endpoint).
[tool.vercel]
entrypoint = "main:app"  # main.py puts src/ on the path

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
